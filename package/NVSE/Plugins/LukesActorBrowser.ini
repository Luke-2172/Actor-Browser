[Controls]
; Hold Back + D-pad direction: 1=Left, 2=Right, 3=Up, 4=Down.
ControllerOpenDirection=2
; Function-key number: 1=F1 through 24=F24. Default 10=F10.
; Shared with MCM. Changes apply within one second after returning to gameplay.
FunctionKey=10
; Relative mouse sensitivity: 0.25 to 5.0. Default 1.6, no smoothing.
MouseSpeed=1.6

[Display]
; Bundled vector fonts: Barlow Condensed Bold and Share Tech Mono.
; High resolution text: 1=1120x700, 2=2240x1400, 3=3360x2100.
; RenderScale changes require a restart.
RenderScale=3
; 20 to 100 percent. Text and selection borders remain bright.
BackgroundOpacity=72

[Audio]
; Open: ui_vats_move. Close: ui_vats_ready.
MenuSounds=1






[Browser]
ShowOverrides=0
; Include Template-named records. Shared with the menu and optional MCM.
ShowTemplates=0



